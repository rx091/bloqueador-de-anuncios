<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Bloqueador de anuncios</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="40" height="40" />
    <h1>Bloqueador de anuncios</h1>
  </header>

  <main>
    <label class="linha">
      <span id="rotulo">Proteção ativada</span>
      <span class="switch">
        <input type="checkbox" id="chave" />
        <span class="slider"></span>
      </span>
    </label>
    <p class="sub">YouTube, TokyVideo e outros sites.</p>
    <p class="sub">Recarregue a página após ativar ou desativar.</p>
  </main>

  <footer>Criado por - Rx0 @rodrigocoutinho91</footer>

  <script src="popup.js"></script>
</body>
</html>
